[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outrigger-protocol"
version = "0.2.0"
description = "Deterministic containment harness and invariant gating for autonomous coding agents (OPS-1)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { name = "Alan Woodyard", email = "Alan@AlanWoodyard.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.scripts]
outrigger = "cli.outrigger:main"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
