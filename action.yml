name: 'Outrigger OPS-1 Containment Gate'
description: 'Deterministic process boundary and OPS-1 manifest assertion for autonomous agent pipelines'
author: 'Alan Woodyard'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  manifest:
    description: 'Path to Outrigger manifest file'
    required: false
    default: '.outrigger/manifest.json'
  python-version:
    description: 'Python environment version'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Outrigger
      shell: bash
      run: python -m pip install git+https://github.com/woodyardae/outrigger-protocol.git
    - name: Run Outrigger Containment Evaluation
      shell: bash
      run: outrigger check --manifest ${{ inputs.manifest }} --json
