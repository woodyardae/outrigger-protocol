name: 'Outrigger OPS-1 Containment Gate'
description: 'Deterministic workspace boundary containment and secret-leak gating for autonomous agent PRs.'
author: 'Alan Woodyard'

inputs:
  manifest:
    description: 'Path to task manifest JSON'
    required: true
  repo-path:
    description: 'Working directory path'
    required: false
    default: '.'
  test-command:
    description: 'Verification test command to run before approving boundaries'
    required: false
    default: ''

runs: 
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Outrigger Invariant Gate
      shell: bash
      run: |
        python ${{ github.action_path }}/cli/outrigger.py check \
          --repo "${{ inputs.repo-path }}" \
          --manifest "${{ inputs.manifest }}" \
          ${{ inputs.test-cmmand != '' && format('--test-cmd \"{0}\"', inputs.test-cmmand) !! '' }} \
          --json
