<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#08151a"/>
  
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#06b6d4" stroke-width="14" stroke-opacity="0.9"/>
  
  <!-- Central Icon Glyph: Outrigger Stabilizer & Hull Boundary (Centered around X=256, Y=210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lateral Outrigger Float Struts -->
    <line x1="140" y1="140" x2="372" y2="140" stroke="#0891b2" stroke-width="8"/>
    <line x1="140" y1="280" x2="372" y2="280" stroke="#0891b2" stroke-width="8"/>
    
    <!-- Outer Stabilizing Pontoons (Boundary Limits) -->
    <rect x="132" y="120" width="20" height="180" rx="10" fill="#0e7490" stroke="#06b6d4" stroke-width="6"/>
    <rect x="360" y="120" width="20" height="180" rx="10" fill="#0e7490" stroke="#06b6d4" stroke-width="6"/>
    
    <!-- Cross Truss Bracing -->
    <line x1="152" y1="140" x2="226" y2="210" stroke="#155e75" stroke-width="6"/>
    <line x1="152" y1="280" x2="226" y2="210" stroke="#155e75" stroke-width="6"/>
    <line x1="360" y1="140" x2="286" y2="210" stroke="#155e75" stroke-width="6"/>
    <line x1="360" y1="280" x2="286" y2="210" stroke="#155e75" stroke-width="6"/>
    
    <!-- Core Sovereign Agent Capsule (Constrained Center) -->
    <rect x="226" y="130" width="60" height="160" rx="30" fill="#082f49" stroke="#22d3ee" stroke-width="8"/>
    <circle cx="256" cy="180" r="14" fill="#67e8f9"/>
    <line x1="256" y1="210" x2="256" y2="255" stroke="#22d3ee" stroke-width="6"/>
  </g>
  
  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#0c232d" stroke="#06b6d4" stroke-width="6"/>
  <text x="256" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="34" 
        font-weight="900" 
        fill="#67e8f9" 
        text-anchor="middle" 
        letter-spacing="4">OPS</text>
</svg>
